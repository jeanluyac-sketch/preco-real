name: Rodada de preços
on:
  schedule:
    - cron: '17 10,15,20,0 * * *'   # 7h, 12h, 17h e 21h de Brasília
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-precos
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run rodar
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL_SUPLEMENTOS: ${{ vars.TELEGRAM_CANAL_SUPLEMENTOS }}
          TELEGRAM_CANAL_PET: ${{ vars.TELEGRAM_CANAL_PET }}
          TELEGRAM_CANAL_FRALDAS: ${{ vars.TELEGRAM_CANAL_FRALDAS }}
      - name: Guardar histórico de preços
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add dados/ metricas.csv
          git diff --cached --quiet || git commit -m "precos: $(date -u +%FT%H%M)"
          git push
      - name: Copiar páginas estáticas (Sabia Disso)
        run: mkdir -p site && cp -r estatico/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
