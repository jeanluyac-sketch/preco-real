name: Mensagem de boas-vindas nos canais
on:
  workflow_dispatch:
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/boasvindas.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANAL_SUPLEMENTOS: ${{ vars.TELEGRAM_CANAL_SUPLEMENTOS }}
          TELEGRAM_CANAL_PET: ${{ vars.TELEGRAM_CANAL_PET }}
          TELEGRAM_CANAL_FRALDAS: ${{ vars.TELEGRAM_CANAL_FRALDAS }}
